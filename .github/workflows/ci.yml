name: CI

on:
  push:
    branches: [main]
  pull_request:
  # deploy.yml calls this to gate every staging/production deploy on it.
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Regenerate binding types so the typecheck matches wrangler.jsonc.
      - run: npm run types

      - run: npm run typecheck

      - run: npm test
